name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      # Optimised photos are kept here between runs (see the cache step below).
      ASTRO_CACHE_DIR: .astro-cache

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the image cache
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/assets/**') }}
          restore-keys: |
            astro-${{ runner.os }}-

      - name: Type check (site + Worker)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://moshik-photography.example

      # Report only. After launch, use `npm run checklist -- --strict` here so
      # placeholders can't sneak back in.
      - name: Launch checklist (report only)
        run: |
          npm run checklist
          {
            echo '### 📸 Launch checklist'
            echo '```'
            npm run --silent checklist -- --no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
