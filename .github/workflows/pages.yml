# Static preview of the site on GitHub Pages:
#   https://romangrinevicai.github.io/moshik-photography/
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The preview has no Cloudflare backend: the booking form falls back to WhatsApp / email,
# the admin panel shows a notice, and only the built-in demo gallery (code DEMO) opens.
# Every page is marked noindex and carries the "Preview" tag.
name: Preview (GitHub Pages)

on:
  push:
    branches: [main, claude/exciting-archimedes-yt1dm1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static preview
        run: npm run build
        env:
          SITE_URL: https://romangrinevicai.github.io
          BASE_PATH: /moshik-photography
          PUBLIC_STATIC_SITE: '1'

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
